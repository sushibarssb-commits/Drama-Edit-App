<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Film strip / drama episodes icon -->
  <g transform="translate(96, 116)">
    <!-- Episode 1 Card -->
    <rect x="0" y="30" width="70" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <circle cx="35" cy="85" r="14" fill="#38bdf8" />
    <!-- Episode 2 Card -->
    <rect x="60" y="20" width="70" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <circle cx="95" cy="85" r="16" fill="#38bdf8" />
    <!-- Episode 3 (Center Batch Core) -->
    <rect x="120" y="0" width="80" height="170" rx="16" fill="url(#primaryGrad)" />
    <!-- Play symbol in center -->
    <polygon points="152,70 152,100 178,85" fill="#ffffff" />
    <!-- Episode 4 Card -->
    <rect x="190" y="20" width="70" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <circle cx="225" cy="85" r="16" fill="#38bdf8" />
    <!-- Episode 5 Card -->
    <rect x="250" y="30" width="70" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <circle cx="285" cy="85" r="14" fill="#38bdf8" />

    <!-- Batch Badge "5x" -->
    <g transform="translate(110, 195)">
      <rect x="0" y="0" width="100" height="42" rx="21" fill="url(#accentGrad)" />
      <text x="50" y="28" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">5 in 1</text>
    </g>
  </g>
</svg>
